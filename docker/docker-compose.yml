services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data  # Persistência dos dados
    ports:
      - "5432:5432"  # Porta exposta para o PostgreSQL
      
volumes:
  pgdata:
